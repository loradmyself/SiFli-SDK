# ========== 文件系统 ==========
CONFIG_RT_USING_DFS_ELMFAT=y

# ========== 日志 ==========
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_LVL_I=y

# ========== 调试 ==========
CONFIG_BSP_USING_FULL_ASSERT=y

# ========== RT-Thread 内存管理 ==========
CONFIG_RT_USING_MEMHEAP=y

# ========== PSRAM 配置 (用于 FFmpeg 内存分配) ==========
# 注意: BSP_USING_PSRAM1 通过 BSP_MPI1_MODE_3 自动启用，无需直接设置
CONFIG_BSP_QSPI1_MEM_SIZE=8

# ========== 音频系统 ==========
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
CONFIG_AUDIO_USING_AUDPROC=y
CONFIG_AUDIO_USING_MANAGER=y
CONFIG_AUDIO_LOCAL_MUSIC=y
CONFIG_AUDIO_SPEAKER_USING_CODEC=y

# ========== FFmpeg 音视频解码 ==========
CONFIG_PKG_USING_FFMPEG=y
CONFIG_PKG_USING_FFMPEG_AUDIO=y

# ========== 性能监控 ==========
CONFIG_USING_CPU_USAGE_PROFILER=y

# ========== Shell 栈大小 ==========
CONFIG_FINSH_THREAD_STACK_SIZE=8192
