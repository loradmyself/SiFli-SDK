CONFIG_BT_TX_POWER_VAL_MAX=13
CONFIG_BSP_USING_I2S=y
CONFIG_BSP_ENABLE_I2S_CODEC=y
# CONFIG_BSP_USING_LCD is not set
# CONFIG_BSP_USING_LED1 is not set
CONFIG_BSP_USING_LED2=y
CONFIG_BSP_LED2_PIN=32
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_BLUETOOTH=y
CONFIG_CFG_AUDIO_RECORD_PIPE_MULT=16
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_LVL_I=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
# Async console output TRIED 2026-10-23 and REVERTED: moved the 6.5 ms/dump
# UART cost out of the BT task (good for the 326 ms sink gap) but the system
# became unstable (suspects: ulog_async thread prio 30 starved / 1 KB stack).
# Do not re-enable without fixing thread priority + stack first.
# CONFIG_ULOG_USING_ASYNC_OUTPUT is not set
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_RT_CONSOLEBUF_SIZE=256
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
CONFIG_BLUETOOTH=y
# CONFIG_BT_RF_TEST is not set
# CONFIG_BLE_GAP_CENTRAL is not set
# CONFIG_BLE_GATT_CLIENT is not set
# CONFIG_BSP_BLE_CONNECTION_MANAGER is not set
CONFIG_BT_FINSH=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_HFP_AG=y
CONFIG_CFG_AV=y
CONFIG_CFG_AV_SRC=y
CONFIG_CFG_AV_SHARING=y
CONFIG_CFG_AV_SNK=y
CONFIG_CFG_AVRCP=y
CONFIG_CFG_BT_VOICE_RELAY=y
# CONFIG_BSP_BT_APP is not set
CONFIG_CFG_MAX_BT_ACL_NUM=2
# HCI snoop tap ON but FILTERED (2026-10-23): full mute reduced the 2nd-
# headset current-noise (A/B confirmed), so the tap now dumps small packets
# (signaling/SCO/events) always and media 1-in-8 — see tl_log_write() in
# middleware/bluetooth/service/internal/bluetooth_config.c.
CONFIG_HCI_ON_LOG=y
CONFIG_LOG_ON_CONSOLE=y
CONFIG_USING_CONTEXT_BACKUP=y
CONFIG_RT_USING_RTT_CMSIS=y
CONFIG_PKG_USING_FLASHDB=y
