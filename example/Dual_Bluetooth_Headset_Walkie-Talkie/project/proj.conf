# RT-Thread services used by the verified Classic Bluetooth examples.
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_BLUETOOTH=y
# Keep the always-on I2S clocks out of RT-Thread sleep transitions.
# CONFIG_RT_USING_PM is not set
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_LVL_I=y
# CONFIG_ULOG_OUTPUT_FLOAT is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_RT_CONSOLEBUF_SIZE=256

# Classic Bluetooth host and public bt_interface layer.
CONFIG_BLUETOOTH=y
# CONFIG_BT_RF_TEST is not set
# CONFIG_BLE_GAP_CENTRAL is not set
# CONFIG_BLE_GATT_CLIENT is not set
# CONFIG_BSP_BLE_CONNECTION_MANAGER is not set
CONFIG_BT_FINSH=y
# HCI raw packet log (temporary debug gear):128KB RAM buffer, mixed
# into the serial console — remove these after the debug session.
CONFIG_HCI_ON_LOG=y
CONFIG_LOG_ON_CONSOLE=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
# CONFIG_CFG_HFP_HF is not set
CONFIG_CFG_HFP_AG=y
CONFIG_CFG_BT_VOICE_RELAY=y
CONFIG_CFG_AV=y
CONFIG_CFG_AV_SRC=y
CONFIG_CFG_AV_SHARING=y
# CONFIG_CFG_AV_SNK is not set
CONFIG_CFG_AVRCP=y
# CONFIG_BT_AUTO_CONNECT_LAST_DEVICE is not set
# CONFIG_BSP_BT_APP is not set
CONFIG_BSP_BT_CONNECTION_MANAGER=y
# CONFIG_BTS2_APP_MENU is not set
CONFIG_BT_CON_NUM_CUSTOMIZE=y
# Keep exactly 2 bonds: a third bond survives reset, lands in the
# reconnect queue and starves one of the two real headsets.
# Pairing a third headset overwrites the LRU (disconnected) entry.
CONFIG_CFG_MAX_BT_ACL_NUM=3
CONFIG_CFG_MAX_BT_BOND_NUM=3

# Audio middleware and I2S RT-Thread audio device.
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
# CONFIG_AUDIO_LOCAL_MUSIC is not set
# CONFIG_AUDIO_SPEAKER_USING_CODEC is not set
CONFIG_AUDIO_TX_USING_I2S=y
# Deepen the pdm/i2s record pipe (default 2): 2x320B is only ~3.7ms and
# overflows whenever the draining thread stalls during BT connect storms,
# splicing stale PCM into the A2DP stream (the connect-time noise).
CONFIG_CFG_AUDIO_RECORD_PIPE_MULT=16
CONFIG_BSP_USING_I2S=y
CONFIG_BSP_ENABLE_I2S_CODEC=y
CONFIG_RT_USING_RTT_CMSIS=y
CONFIG_PKG_USING_FLASHDB=y
# CONFIG_PKG_USING_WEBRTC is not set
CONFIG_USING_CONTEXT_BACKUP=y

# Nano N4 application overrides. The demo does not use the display stack.
# CONFIG_BSP_USING_LCD is not set
# CONFIG_BSP_USING_LCDC is not set
# CONFIG_BSP_USING_TOUCHD is not set
# CONFIG_RT_USB_DEVICE_PRINTER is not set

# Nano LEDs are active-low: LED1=PA31 (board default), LED2=PA32.
CONFIG_BSP_USING_LED2=y
CONFIG_BSP_LED2_PIN=32
CONFIG_INSERT_DETE_USB_PIN=-1
